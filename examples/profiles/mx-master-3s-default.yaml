# Example MVP profile — MX Master 3S (reference device).
# No app-specific profiles in MVP.
schema_version: 1

meta:
  name: "3S — default demo"
  description: "SmartShift + gesture button remaps for spike/apply via CfgWriter"
  transport: any

device:
  name: "MX Master 3S"
  family: mx-master-3s
  pid_hint: "046d:b034"   # Bluetooth; Bolt uses receiver 046d:c548

dpi: 1000

# Plasma/libinput ScrollFactor (kcminputrc). Safe “lines per notch” without divert.
plasma_scroll_factor: 0.3

smartshift:
  "on": true   # quote key — YAML 1.1 treats bare `on` as boolean
  threshold: 30
  # torque: 50   # uncomment if device/feature exposes torque in logiops

hiresscroll:
  # hires:false with SmartShift on → scroll per ratchet notch (not micro-scroll).
  hires: false
  invert: false
  target: false
  # Optional experimental: target: true + scroll_multiplier (emits up/down Axis).
  # Prefer plasma_scroll_factor above. Never set target without both axes.
  # scroll_multiplier: 1.0

# Thumb wheel (HID++ 0x2150). divert=false → OS horizontal scroll.
# No haptic field in logiops 0.3.5 schema.
thumbwheel:
  divert: false
  invert: false
  # When divert:true, useful examples:
  # left:  { mode: Axis, axis: REL_HWHEEL_HI_RES, axis_multiplier: -1 }
  # right: { mode: Axis, axis: REL_HWHEEL_HI_RES, axis_multiplier: 1 }
  # tap:   { type: Keypress, keys: [KEY_MUTE] }
  # touch: { type: Keypress, keys: [KEY_LEFTMETA] }
  # proxy: { type: Keypress, keys: [KEY_LEFTCTRL, KEY_X] }

buttons:
  # Gesture button (CID 0xc3 / 195) — typical 3S
  - cid: 0xc3
    label: gesture
    action:
      type: Gestures
      gestures:
        - direction: Up
          mode: OnRelease
          action:
            type: Keypress
            keys: ["KEY_LEFTMETA", "KEY_UP"]
        - direction: Down
          mode: OnRelease
          action:
            type: Keypress
            keys: ["KEY_LEFTMETA", "KEY_DOWN"]
        - direction: Left
          mode: OnRelease
          action:
            type: Keypress
            keys: ["KEY_LEFTMETA", "KEY_LEFT"]
        - direction: Right
          mode: OnRelease
          action:
            type: Keypress
            keys: ["KEY_LEFTMETA", "KEY_RIGHT"]
        - direction: None
          mode: OnRelease
          action:
            type: Keypress
            keys: ["KEY_LEFTMETA"]

  # Mode / SmartShift toggle (CID 0xc4 / 196)
  - cid: 0xc4
    label: mode
    action:
      type: ToggleSmartShift

  # Forward (0x56 / 86) → browser forward
  - cid: 0x56
    label: forward
    action:
      type: Keypress
      keys: ["KEY_FORWARD"]

  # Back (0x53 / 83) → browser back
  - cid: 0x53
    label: back
    action:
      type: Keypress
      keys: ["KEY_BACK"]
