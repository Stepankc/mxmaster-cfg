[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mxmaster-cfg"
version = "0.2.3"
description = "Linux GUI for Logitech MX Master (logiops): DPI, SmartShift, Plasma scroll speed, ratchet-safe hi-res — Debian/Ubuntu/Kubuntu"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Stepan Korobkov", email = "stepan.korobkov@maergroup.ru" }]
keywords = ["logitech", "mx-master", "logiops", "linux", "kde", "pyside6", "hidpp"]
dependencies = [
  "PySide6>=6.5",
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dbus = [
  # Prefer dasbus on Debian/Ubuntu when packaged; jeepney is pure-Python fallback.
  "dasbus>=1.7",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.4",
]

[project.scripts]
mxmaster-cfg = "mxmaster_cfg.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mxmaster_cfg = ["schema/*.json"]
